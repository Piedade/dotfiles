#!/bin/bash
# === LAUNCH ===

bindsym $mod+m exec swaymsg "output * dpms on"

# App launcher
bindsym $mod+p exec $menu

# Terminal
bindsym $mod+Return exec $term

# Browser (Firefox)
bindsym $mod+b exec chrome

# Browser (Firefox private)
bindsym $mod+Shift+b exec chrome --private-window

# Show keybindings help
bindsym $mod+F12 exec $config_dir/scripts/help

# Clipboard history
bindsym $mod+c exec cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Layout menu
bindsym $mod+Shift+t exec $config_dir/scripts/sway-layout-menu.sh

# File manager (Thunar)
bindsym $mod+e exec $config_dir/scripts/thunar-scratchpad

# Calculator
# bindsym Scroll_Lock exec galculator
bindsym XF86Calculator exec galculator

# GIMP
bindsym $mod+g exec gimp

# === WINDOW STATE ===

# Toggle floating
bindsym $mod+Shift+space floating toggle

# Toggle fullscreen
bindsym $mod+f fullscreen

# Cycle layout (split → tabbed → stacking), auto-escaping past any
# single-child wrapper containers to reach the real sibling group first
# bindsym $mod+t exec $config_dir/scripts/layout-toggle-smart.sh
bindsym $mod+t layout toggle split tabbed stacking

# Tabbed layout
# bindsym $mod+w layout tabbed

# focus_wrapping yes|no|force|workspace (dont tab to other monitor)
focus_wrapping workspace

# Cycle through tabs / siblings in current container
bindsym Mod1+Tab focus next sibling
# Cycle through tabs (previous)
bindsym Mod1+Shift+Tab focus prev sibling

# Toggle floating / focus tiled-floating
bindsym $mod+Space focus mode_toggle, floating toggle

# Move focus to the parent container
bindsym $mod+a focus parent
bindsym $mod+Shift+a focus child

# === WM CONTROL ===

# Reload sway
bindsym $mod+Shift+r reload

# Exit sway
bindsym $mod+Shift+q exit

# Close window
bindsym $mod+q kill

# Power menu (shutdown/reboot)
bindsym $mod+Shift+Return exec $config_dir/scripts/power

# Toggle notification center (swaync)
bindsym $mod+Shift+n exec swaync-client -t

# Toggle idle (bloqueio/dpms/suspensão automáticos)
bindsym $mod+Shift+i exec $config_dir/scripts/idle-toggle

# === WINDOW NAVIGATION ===

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# Move focused window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# === WINDOW RESIZE ===

bindsym $mod+Ctrl+Left resize shrink width 10px
bindsym $mod+Ctrl+Right resize grow width 10px
bindsym $mod+Ctrl+Up resize shrink height 10px
bindsym $mod+Ctrl+Down resize grow height 10px

bindsym $mod+Ctrl+$left resize shrink width 10px
bindsym $mod+Ctrl+$right resize grow width 10px
bindsym $mod+Ctrl+$up resize shrink height 10px
bindsym $mod+Ctrl+$down resize grow height 10px

# Balance windows
bindsym $mod+Ctrl+equal balance

# === MEDIA & BRIGHTNESS ===

# Volume control
bindsym --locked XF86AudioRaiseVolume exec $config_dir/scripts/changevolume up
bindsym --locked XF86AudioLowerVolume exec $config_dir/scripts/changevolume down
bindsym --locked XF86AudioMute exec $config_dir/scripts/changevolume mute
bindsym --locked XF86AudioMicMute exec $config_dir/scripts/changevolume micmute
# bindsym $mod+F12 exec $config_dir/scripts/changevolume up
# bindsym $mod+F11 exec $config_dir/scripts/changevolume down
# bindsym $mod+F10 exec $config_dir/scripts/changevolume mute

# Special keys to control media via playerctl
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioStop exec playerctl stop

# Pause/Break key: toggle radio between muted (headphones) and audible (monitor)
bindsym --locked Pause exec $config_dir/scripts/radio-toggle
# Mod+Pause: pick a radio station
bindsym --locked $mod+Pause exec $config_dir/scripts/radio-menu

# brightnessctl not applicable on desktop with HDMI monitor
# bindsym XF86MonBrightnessUp exec brightnessctl set +5%
# bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# === SCREENSHOTS ===

# Region screenshot
bindsym Print exec $config_dir/scripts/screenshot region

# Window screenshot
bindsym $mod+Print exec $config_dir/scripts/screenshot window

# Fullscreen screenshot
bindsym $mod+Shift+Print exec $config_dir/scripts/screenshot full

# === WORKSPACES ===

# Workspace vars
set $ws1 number 1
set $ws2 number 2
set $ws3 number 3
set $ws4 number 4
set $ws5 number 5
set $ws6 number 6
set $ws7 number 7
set $ws8 number 8
set $ws9 number 9
set $ws10 number 10
set $ws11 number 11
set $ws12 number 12

# Switch to workspace (relative to the focused monitor, dwm-tag style)
bindsym $mod+1 exec $config_dir/scripts/workspace-relative.sh goto 1
bindsym $mod+2 exec $config_dir/scripts/workspace-relative.sh goto 2
bindsym $mod+3 exec $config_dir/scripts/workspace-relative.sh goto 3
bindsym $mod+4 exec $config_dir/scripts/workspace-relative.sh goto 4
bindsym $mod+5 exec $config_dir/scripts/workspace-relative.sh goto 5
bindsym $mod+6 exec $config_dir/scripts/workspace-relative.sh goto 6
bindsym $mod+F1 exec $config_dir/scripts/workspace-relative.sh goto 1 other
bindsym $mod+F2 exec $config_dir/scripts/workspace-relative.sh goto 2 other
bindsym $mod+F3 exec $config_dir/scripts/workspace-relative.sh goto 3 other
bindsym $mod+F4 exec $config_dir/scripts/workspace-relative.sh goto 4 other
bindsym $mod+F5 exec $config_dir/scripts/workspace-relative.sh goto 5 other
bindsym $mod+F6 exec $config_dir/scripts/workspace-relative.sh goto 6 other

# Move focused window to workspace (relative to the focused monitor)
bindsym $mod+Shift+1 exec $config_dir/scripts/workspace-relative.sh move 1
bindsym $mod+Shift+2 exec $config_dir/scripts/workspace-relative.sh move 2
bindsym $mod+Shift+3 exec $config_dir/scripts/workspace-relative.sh move 3
bindsym $mod+Shift+4 exec $config_dir/scripts/workspace-relative.sh move 4
bindsym $mod+Shift+5 exec $config_dir/scripts/workspace-relative.sh move 5
bindsym $mod+Shift+6 exec $config_dir/scripts/workspace-relative.sh move 6
bindsym $mod+Shift+F1 exec $config_dir/scripts/workspace-relative.sh move 1 other
bindsym $mod+Shift+F2 exec $config_dir/scripts/workspace-relative.sh move 2 other
bindsym $mod+Shift+F3 exec $config_dir/scripts/workspace-relative.sh move 3 other
bindsym $mod+Shift+F4 exec $config_dir/scripts/workspace-relative.sh move 4 other
bindsym $mod+Shift+F5 exec $config_dir/scripts/workspace-relative.sh move 5 other
bindsym $mod+Shift+F6 exec $config_dir/scripts/workspace-relative.sh move 6 other

# Alterna entre o workspace atual e o último ativo
bindsym $mod+Tab workspace back_and_forth

# #
# # Scratchpad:
# #
#     # Sway has a "scratchpad", which is a bag of holding for windows.
#     # You can send windows there and get them back later.

#     # Move the currently focused window to the scratchpad
#     bindsym $mod+Shift+minus move scratchpad

#     # Show the next scratchpad window or hide the focused scratchpad window.
#     # If there are multiple scratchpad windows, this command cycles through them.
#     bindsym $mod+minus scratchpad show

